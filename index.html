<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
font-family:Courier New, monospace;
overflow:hidden;
color:white;
}

/* Hacker Screen */

#hacker{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
}

h1{
color:#ff8de8;
font-size:34px;
text-shadow:0 0 15px hotpink;
margin-bottom:20px;
}

#terminal{
width:90%;
max-width:500px;
height:260px;
background:#111;
border:2px solid #ff8de8;
border-radius:15px;
padding:20px;
overflow:hidden;
box-shadow:0 0 20px #ff66cc;
}

#typing{
color:#6dff6d;
font-size:18px;
line-height:30px;
white-space:pre-line;
}

.cursor{
display:inline-block;
width:10px;
background:#6dff6d;
animation:blink .8s infinite;
}

@keyframes blink{

50%{
opacity:0;
}

}

</style>
</head>

<body>

<div id="hacker">

<h1>ACCESSING SYSTEM...</h1>

<div id="terminal">

<div id="typing"></div>

<span class="cursor"></span>

</div>

</div>
