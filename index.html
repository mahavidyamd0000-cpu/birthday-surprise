<!DOCTYPE html>
<html>
<head>
<title>Surprise</title>
<style>
body{
margin:0;
background:black;
color:#00ff00;
font-family:Courier New;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}
#box{
text-align:center;
}
h1{
font-size:45px;
text-shadow:0 0 15px lime;
}
p{
font-size:22px;
}
button{
padding:15px 30px;
font-size:18px;
border:none;
background:#00ff88;
cursor:pointer;
border-radius:10px;
margin-top:20px;
}
</style>
</head>

<body>

<div id="box">
<h1 id="title">Initializing...</h1>
<p id="msg">Please wait...</p>
<button id="btn" onclick="surprise()" style="display:none;">
Unlock Surprise
</button>
</div>

<script>

let step=0;

let title=document.getElementById("title");
let msg=document.getElementById("msg");

let data=[
["Connecting Server...","██████░░░░"],
["Scanning Device...","████████░░"],
["Access Granted","██████████"],
["Loading Secret...","Almost Done..."]
];

function load(){

if(step<data.length){

title.innerHTML=data[step][0];
msg.innerHTML=data[step][1];

step++;

setTimeout(load,1200);

}else{

title.innerHTML="💻 ACCESS COMPLETE";
msg.innerHTML="Click below to unlock";

document.getElementById("btn").style.display="inline";

}

}

load();

function surprise(){

document.body.style.background="#111";

title.innerHTML="🎉 SURPRISE 🎉";

msg.innerHTML="❤️<br><br>You are stronger than you think.<br><br>Keep Smiling 😊";

document.getElementById("btn").innerHTML="✨ Don't Forget to Smile..!✨";

}

</script>

</body>
</html>
